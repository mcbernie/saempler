[workspace]
resolver = "2"
members = [
    "crates/saempler-model",
    "crates/saempler-audio",
    "crates/saempler-ui",
    "crates/saempler-plugin",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "GPL-3.0-or-later"
repository = "https://github.com/mcbernie/saempler"

[workspace.dependencies]
saempler-model = { path = "crates/saempler-model" }
saempler-audio = { path = "crates/saempler-audio" }
saempler-ui = { path = "crates/saempler-ui" }

# NIH-plug is not published on crates.io, so it is pinned to a reviewed revision.
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
nih_plug_egui = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }
nih_plug_xtask = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683" }

# Pinned to the same major version NIH-plug uses for its standalone wrapper so the
# workspace does not end up with two copies of the queue implementation.
rtrb = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = "thin"
strip = "symbols"

[profile.profiling]
inherits = "release"
debug = true
strip = "none"
