[package]
name = "saempler-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "VST3, CLAP and standalone host integration for Sämpler"

[lib]
# `cdylib` produces the plugin binaries, `lib` is needed by the standalone bin.
crate-type = ["cdylib", "lib"]

[[bin]]
# Named differently from the library so both can be built in one invocation
# without their debug symbols colliding.
name = "saempler"
path = "src/main.rs"

[dependencies]
saempler-model.workspace = true
saempler-audio.workspace = true
saempler-core.workspace = true
saempler-ui.workspace = true
nih_plug = { workspace = true, features = ["assert_process_allocs", "standalone"] }
nih_plug_egui.workspace = true
rfd.workspace = true

[dev-dependencies]
# Stands in for the host's state format in the round trip tests.
serde_json.workspace = true

[lints.rust]
# `nih_export_vst3!` expands to `vst3_com::vtable`, which puts a trailing
# semicolon in expression position. Newer compilers refuse that, and nothing
# in this crate can change the macro; it goes when nih-plug's VST3 bindings
# are updated.
#
# The lint was renamed along the way, so both names are listed and unknown
# ones are tolerated: whichever compiler builds this, exactly one of the two
# exists and the other would otherwise fail the check it is here to pass.
#
# Declared here rather than as an attribute on the invocation, because a
# compiler that does not raise the lint reports the attribute as unused.
unknown_lints = "allow"
semicolon_in_expressions_from_macros = "allow"
semicolon_in_expressions_from_non_local_macros = "allow"
